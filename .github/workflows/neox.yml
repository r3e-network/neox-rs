name: neox

on:
  push:
    branches: [neox]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  rustfmt:
    name: Neo X Rust (fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  rust:
    name: Neo X Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            cache_mode: READ_ONLY
          - check: clippy
            cache_mode: READ_ONLY
          - check: build
            cache_mode: READ_WRITE
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Avoid concurrent uploads to the shared cache; the production build owns writes.
      SCCACHE_GHA_RW_MODE: ${{ matrix.cache_mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - run: .github/scripts/install_llvm.sh ubuntu
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          # sccache owns compiler outputs; keep this cache limited to Cargo inputs.
          cache-targets: false
      - name: Run Neo X tests
        if: matrix.check == 'tests'
        run: >-
          cargo +stable test --locked
          -p reth-neox-chainspec
          -p reth-neox-consensus
          -p reth-neox-consensus-engine
          -p reth-neox-antimev
          -p reth-neox-evm
          -p reth-neox-network
          -p reth-neox-node
          -p neox-rs
      - name: Run strict Neo X clippy
        if: matrix.check == 'clippy'
        run: >-
          cargo +stable clippy --locked --all-targets
          -p reth-neox-chainspec
          -p reth-neox-consensus
          -p reth-neox-consensus-engine
          -p reth-neox-antimev
          -p reth-neox-evm
          -p reth-neox-network
          -p reth-neox-node
          -p neox-rs
          -- -D warnings
      - name: Build Neo X binaries
        if: matrix.check == 'build'
        run: cargo +stable build --locked -p neox-rs --bins

  compatibility-tools:
    name: Neo X compatibility tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: tools/neox-dkg-prover/go.sum
      - name: Test DKG prover helper
        working-directory: tools/neox-dkg-prover
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Build and verify static DKG prover helper
        working-directory: tools/neox-dkg-prover
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/neox-dkg-prover .
          if ! file /tmp/neox-dkg-prover | grep 'ELF .*statically linked' >/dev/null; then
            echo "DKG prover must be a statically linked ELF executable" >&2
            exit 1
          fi
          if readelf -lW /tmp/neox-dkg-prover | grep 'INTERP' >/dev/null; then
            echo "DKG prover must not contain a PT_INTERP segment" >&2
            exit 1
          fi
      - name: Test interoperability gates
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
