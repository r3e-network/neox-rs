[neox_geth]
repository = "https://github.com/bane-labs/go-ethereum"
branch = "bane-main"
commit = "9dec1dc364d3db117bd87eb3613cc4de970912e2"
version = "0.7.0-dev"
# Synced to bane-main on 2026-10-18; this is the new oracle tip.
tip_under_review = "9dec1dc364d3db117bd87eb3613cc4de970912e2"
tip_delta_commits = 0
# Changes since the previous f0e236838b baseline:
# - 8fde8c492f: config: remove 'osaka' configuration from genesis files (aligned with Reth)
# - 9dec1dc364: consensus/dbft: use gasPool.Used() for the finalized pre-block gas used
# - cc7af690d0: consensus/dbft: optimize proposal waiting while syncing
# - 72579cf19c / 9c4410e: BlockAccessList plumbing, gated to Amsterdam (not scheduled on Neo X)
# The Rust client's cumulative transaction gas already matches gasPool.Used(); Amsterdam/BAL
# paths stay dormant because neither public Neo X network schedules Amsterdam.

# Genesis fingerprints are SHA-256 over the ORACLE's original bytes for that chain, not over the
# repository file at `path`: the committed JSON may differ from the oracle bytes in trailing
# whitespace or line-ending normalization. Compatibility is defined by the two JSON objects being
# semantically equal, which was verified when the fingerprint was recorded; use the hashes to
# identify the oracle input, and a normalized-JSON comparison to re-verify the repository copy.

[neox_geth.genesis.mainnet]
path = "crates/neox/chainspec/res/genesis_mainnet.json"
sha256 = "5226a767c0f608cdb3e56a336225890703baad4dfcdcb6518ba965f59fbfc8b1"
chain_id = 47763

[neox_geth.genesis.testnet]
path = "crates/neox/chainspec/res/genesis_testnet.json"
sha256 = "538dc0fa25402227591034af314c1f448e4432a16c9aa0bccbeb8e114efa1aa1"
chain_id = 12227332

# Offline cross-implementation vectors captured from the oracle commit above.
#
# Provenance: 26/26 files under `antimev/` and `crypto/tpke/` are byte-identical to
# `f0e236838bb334c7c0d29eeca33533ed0cfda254` and remain unchanged at the current
# `9dec1dc364d3db117bd87eb3613cc4de970912e2` baseline (compared with `git show FETCH_HEAD:<path>`,
# which does NOT normalize line endings; an earlier `git diff`-based comparison did normalize
# CRLF and therefore only proved content equality, not byte equality). The two exporters below
# are files added by this audit and do not exist in the baseline commit.
#
# The vectors are NOT reproducible byte-for-byte: the oracle's `KeyStore.Encrypt` draws a random
# AES key per run. Re-running the exporters produces different but self-consistent snapshots,
# which will NOT match the Rust test constants. Treat the hashes as an integrity record of the
# snapshot the tests were written against, not as a reproducibility guarantee.
[neox_geth.cross_implementation_vectors]
exporter_dir = "docs/neox/vectors/geth-exporter"
exporters = [
    "neox_cross_vectors_test.go",
    "neox_pkcs7_probe_test.go",
    "neox_pkcs7_reachability_test.go",
    "neox_ciphertext_admission_test.go",
]

[neox_geth.cross_implementation_vectors.tpke]
path = "docs/neox/vectors/geth-tpke-vectors.json"
sha256 = "459bafab381fae5cd4da6f45d3b37a8bdef043e625fa3898e6bcf45d6959bc9c"
note = "single-round DKG: scaler, layout constants, global key, per-validator shares, one Envelope"

[neox_geth.cross_implementation_vectors.pkcs7]
path = "docs/neox/vectors/geth-pkcs7-vectors.json"
sha256 = "116990f9a41213fcbd98ced48e18dd05ef459382df28f2b2e68d26b0f35a359c"
note = "oracle unpadding acceptance set; documents the confirmed PKCS#7 divergence"

[neox_geth.cross_implementation_vectors.reshare]
path = "docs/neox/vectors/geth-reshare-vectors.json"
sha256 = "9ce99d4c7466c09ef8183f595fe44d39e14e8556647768762d37f94cf77dc7d4"
note = "two DKG rounds with the first aggregate commitment passed back as lastRoundCmt; captures both the shared and reshared key groups"
generator = "docs/neox/vectors/gen_reshare_test.py"

# Proves the PKCS#7 divergence is reachable on-chain, not just an implementation-level difference.
# The oracle recovers a complete, decodable inner transaction from this Envelope; Rust rejects it
# at the unpadding step and falls back to executing the Envelope as-is, so the two clients put
# different transactions in the same block slot. See FULL-AUDIT section 4.1.
[neox_geth.cross_implementation_vectors.pkcs7_reachability]
path = "docs/neox/vectors/geth-pkcs7-reachability.json"
sha256 = "28acb9b3d67eb18f60dc386626a4e25aa8e3b89932ca938f179d4a1e310add7d"
note = "crafted Envelope with padding length 32 (outside 1..=16) whose lenient unpad yields a real signed EIP-1559 transaction; oracle accepts and would execute it, Rust rejects with InvalidPkcs7Padding"
generator = "docs/neox/vectors/gen_pkcs7_reachability_test.py"
severity = "high"
fixed = false

# Confirms the second divergence: the oracle defines CipherText.Verify() but never calls it
# (zero non-test call sites across antimev/, consensus/, core/, crypto/tpke/). The tampered
# ciphertext is the valid one with R replaced by R+g1, so it still deserializes but its pairing
# relation is broken. The oracle admits it into the txpool and into a block, then fails
# aggregation for all C(7,5)=21 quorums; dbft check.go:79-85 turns that into an indefinite
# stall at that height. Rust rejects it at txpool admission, so it never gets that far.
#
# Note the consequence is a LIVENESS stall, NOT a state fork: AggregateAndDecrypt's pairing
# check e(PK,commitment)·e(rpk,g2)==1 is equivalent to Verify()'s e(R,g2)·e(g1,commitment)==1,
# so there is no input the oracle can decrypt and Rust cannot. See FULL-AUDIT section 5.1.
[neox_geth.cross_implementation_vectors.ciphertext_admission]
path = "docs/neox/vectors/geth-ciphertext-admission.json"
sha256 = "6382109be8dbeaa25c7dbf64aacb32b925f2a1a2c718a3533c4102944fd99c81"
note = "valid Envelope alongside an identical one whose ciphertext R slot is shifted by g1; the oracle admits both (IsEnvelope, FromBytes) and can decrypt neither tampered one, Rust rejects at admission with InvalidCiphertextCommitment"
generator = "docs/neox/vectors/gen_ciphertext_admission_test.py"
severity = "high"
fixed = false

# Drives the oracle's real parse path (PreBlock.SetTransactions -> decodeEnvelopeData) plus the
# Envelope round filter at preblock.go:145. The filter uses Go's builtin min (not max) on uint32
# operands, so its lower bound is always 1: despite the "current/previous" comment it admits
# Envelopes from ANY earlier round, and SetData files all non-current rounds into the previous
# bucket, which aggregateAndDecrypt verifies as one batch. Reth reproduces the same filter, so
# this is shared behaviour rather than a divergence - both sides pin it with table tests so a
# one-sided fix fails a test instead of desynchronising a network. FULL-AUDIT section 5.2.
[neox_geth.generated_tests.envelope_admission]
path = "docs/neox/vectors/gen_admission_decode_test.py"
sha256 = "734bede070f4d2034c6533ae3ca9e4f7b2b5cba3f02b1edaa2e505f72a9e9713"
target = "consensus/dbft/neox_admission_decode_test.go"
target_sha256 = "8fb49b5be3a93fd1ecd0c4b79a770988658a4928eb07e0a70fdda2746603599c"
tests = [
    "TestEnvelopeDecodeAcceptsUnverifiedCiphertext",
    "TestEnvelopeDecodeRejectsRoundZero",
    "TestEnvelopeRoundFilterAdmitsEveryEarlierRound",
]
note = "generated from geth-ciphertext-admission.json; the generated Go file lives in the oracle tree, so both hashes are recorded here as an integrity anchor"

[neox_geth.generated_tests.rust_admission]
path = "docs/neox/vectors/gen_ciphertext_admission_test.py"
sha256 = "dcafcffc2543603a7d80e4dca9fbe51ccca978f38c37768cc5e41dac3ffa30f6"
targets = [
    "crates/neox/antimev/tests/geth_ciphertext_admission.rs",
    "crates/neox/node/src/pool.rs",
]
note = "emits the Rust half of the admission proof and self-verifies the injected hex constant against the exported vector"
